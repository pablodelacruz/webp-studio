name: CodeQL

# Análisis estático del código real del plugin.
#
# El default setup de GitHub detectó javascript-typescript y actions pero no php,
# que es el grueso de este plugin. Por eso este workflow es explícito: la matriz
# declara los lenguajes que queremos, en vez de confiar en la autodetección.
#
# Duplica parte del trabajo de Skylos, y a propósito. Skylos cubre PHP con
# dead-code y security; CodeQL aporta un modelo de datos distinto sobre el mismo
# lenguaje. Dos analizadores que coincidan son evidencia; uno solo deja puntos ciegos.

on:
  push:
    branches: [main]
  schedule:
    # Lunes 04:27 UTC. Fuera de las horas redondas, que es cuando todo el mundo
    # programa sus jobs y GitHub se satura.
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # CodeQL sobre un plugin pequeño no tarda ni 10 minutos. Si se pasa, algo
    # está mal y no vale la pena seguir consumiendo runner.
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      # Que un lenguaje falle no debe cancelar el análisis de los otros.
      fail-fast: false
      matrix:
        language: [ 'php', 'javascript-typescript', 'actions' ]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # No hay init/autobuild: PHP y el JS del admin no tienen build step, y
      # actions/ sólo analiza el YAML del workflow.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3