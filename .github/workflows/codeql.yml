name: CodeQL

# Análisis estático del JS del admin y de los propios workflows.
#
# NO incluye PHP, y no por descuido: CodeQL no soporta PHP. GitHub lo dice
# explícitamente, "CodeQL does not support languages that are not listed above.
# This includes, but is not limited to, PHP", y descarta en silencio los
# lenguajes no soportados. Poner 'php' en la matriz de abajo no produce un
# error: simplemente no aparece el job. Lo que se declare sin soporte es una
# falsa sensación de cobertura.
#
# Los lenguados que CodeQL soporta son C/C++, C#, Go, Java/Kotlin,
# JavaScript/TypeScript, Python, Ruby, Rust, Swift y los workflows de Actions.
#
# El PHP de este plugin lo cubre Skylos, no CodeQL. Eso vuelve a Skylos
# estructuralmente importante: es el único análisis estático sobre el grueso
# del código. Ver .github/workflows/release.yml.
#
# Duplicar el análisis sobre el JS y los workflows es a propósito: son las
# piezas que CodeQL sí soporta, y ahí no se solapa con lo que cubre Skylos.

on:
  push:
    branches: [main]
  schedule:
    # Lunes 04:27 UTC. Fuera de las horas redondas, que es cuando todo el mundo
    # programa sus jobs y GitHub se satura.
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # CodeQL sobre un plugin pequeño no tarda ni 10 minutos. Si se pasa, algo
    # está mal y no vale la pena seguir consumiendo runner.
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      # Que un lenguaje falle no debe cancelar el análisis de los otros.
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'actions' ]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # No hay init/autobuild: PHP y el JS del admin no tienen build step, y
      # actions/ sólo analiza el YAML del workflow.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3