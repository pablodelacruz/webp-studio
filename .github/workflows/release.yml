name: Release

# Se dispara por tags, no por pushes a main.
#
# Motivo: la protección de rama pide que los cambios lleguen por pull request. Si
# el release dependiera de un push a main, habría dos formas de publicar: o la
# protección es consultiva (enforce_admins desactivado), o el pipeline se salta al
#gate. Con tags, publicar no requiere tocar main en absoluto.
#
# Flujo: release.sh sube la versión -> se commitea y entra por PR -> se crea el tag
# vX.Y.Z -> se pushea el tag -> este workflow construye y publica.
#
# El tag es la fuente de verdad del release, y se verifica contra el header del
# plugin. Si no coinciden, el job falla en vez de publicar un release mal etiquetado.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# Un grupo por tag: dos releases distintos pueden correr en paralelo sin pisarse.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Scan, build, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Acciones pineadas a SHA completo: Skylos marca las referencias móviles como
      # SKY-D292, y con tags el gate señalaría su propio workflow en cada push.
      # PHP: dead-code y security soportados; quality no lo está para PHP.
      - name: Skylos
        uses: duriantaco/skylos@abb2eab0172fc8ac7f7013e03e6e54d68f30d008 # v4.47.2
        with:
          mode: gate
          analysis: dead-code security

      - name: Build plugin zip
        run: ./build-zip.sh

      - name: Verify tag matches plugin version
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag="${TAG}"
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '${tag}' no tiene forma vX.Y.Z"
            exit 1
          fi
          version="${tag#v}"

          header="$(grep -m1 -E '^[[:space:]]*\*[[:space:]]*Version:' webp-studio/webp-studio.php \
            | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')"

          if [ "${header}" != "${version}" ]; then
            echo "::error::El tag dice ${version} pero webp-studio.php dice ${header}."
            echo "::error::Subí la versión con ./release.sh y commiteá antes de crear el tag."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          # Notas desde el changelog que mantiene release.sh en readme.txt. Si la
          # versión no tiene sección todavía, cae a notas autogeneradas en vez de
          # publicar un release vacío.
          notes="$(awk -v v="${version}" '
            $0 ~ "^= " v " =" { grab=1; next }
            grab && /^= [0-9]/ { exit }
            grab && /^== / { exit }
            grab && NF { print }
          ' webp-studio/readme.txt)"

          if [ -n "${notes}" ]; then
            printf '%s\n' "${notes}" > release-notes.md
            echo "notes=release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::readme.txt no tiene sección para ${version}; se usarán notas generadas por GitHub"
            echo "notes=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          NOTES: ${{ steps.meta.outputs.notes }}
        run: |
          set -euo pipefail

          # Normalmente el tag es nuevo y esta rama no se usa. Existe para que un
          # re-run manual del job no falle si el release llegó a crearse antes.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "El release ${TAG} ya existe; se reemplaza el asset."
            gh release upload "${TAG}" webp-studio.zip --clobber
          else
            if [ -n "${NOTES}" ]; then
              gh release create "${TAG}" webp-studio.zip \
                --title "${TAG}" --notes-file "${NOTES}"
            else
              gh release create "${TAG}" webp-studio.zip \
                --title "${TAG}" --generate-notes
            fi
          fi

          echo "::notice::Release ${TAG} listo ($( du -h webp-studio.zip | cut -f1 ))."